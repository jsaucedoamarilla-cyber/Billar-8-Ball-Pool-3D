<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1f1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>🎱 Billar 8 · San Pedro del Ycuamandiyú</title>
<style>
/* ============================================================
   RESET Y BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0c1f1f;color:#fff;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none}
body{overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;
  padding:10px 14px;color:#fff;background:#3a4166;cursor:pointer;transition:transform .08s,filter .15s}
button:active{transform:scale(.96);filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea{font-family:inherit}
img{max-width:100%}

/* ============================================================
   BOTONES DE COLORES
   ============================================================ */
.b1{background:linear-gradient(#2fa633,#1a5a20)}
.b2{background:linear-gradient(#d4a017,#8a5a12)}
.b3{background:linear-gradient(#1e4fd8,#0e2a5e)}
.b4{background:linear-gradient(#7a2fc7,#41186e)}
.b5{background:linear-gradient(#3a4166,#20263c)}
.b6{background:linear-gradient(#c0392b,#701a12)}

/* ============================================================
   LAYOUT GENERAL
   ============================================================ */
#home{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:20px}
#game{position:absolute;inset:0;display:none;flex-direction:column;background:#0a1a1a}
#cw{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-bottom:12px}
#cv{display:block;background:#0a1a1a;touch-action:none;border-radius:6px}

/* ============================================================
   TOP BAR HOME
   ============================================================ */
.top{display:flex;align-items:center;gap:6px;padding:8px 8px;overflow-x:auto;
  background:linear-gradient(#1a2a3a,#0c1f1f);border-bottom:1px solid #2a3a4a;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.cl{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:52px;padding:6px 4px;font-size:11px;font-weight:700;text-align:center;
  background:#1d2236;border-radius:10px;cursor:pointer;flex-shrink:0;line-height:1.15}
.cl:active{background:#2a3550}
.cl .av{width:36px;height:36px;border-radius:50%;background:#2a3550;display:grid;
  place-items:center;font-size:22px;overflow:hidden;margin-bottom:2px}
.cl .av img{width:100%;height:100%;object-fit:cover}
.cl .lv{background:#d4a017;color:#000;border-radius:6px;padding:1px 6px;font-size:11px}

/* ============================================================
   HERO / LOGO
   ============================================================ */
.hero{padding:14px 12px 8px;text-align:center;position:relative}
.logo{font:900 34px system-ui;font-style:italic;letter-spacing:1px;
  background:linear-gradient(#ffd23f,#e08a1e);-webkit-background-clip:text;
  background-clip:text;color:transparent;text-shadow:0 3px 0 #0006;filter:drop-shadow(0 0 10px #ffd23f66)}
.evento-badge{display:inline-block;margin-top:6px;background:#000a;color:#ffd23f;
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:900;border:1px solid #ffd23f44}

/* ============================================================
   ROW DE BOTONES PRINCIPALES
   ============================================================ */
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:10px 12px}
.t{padding:14px 8px;font-size:13px;border-radius:12px;line-height:1.2;min-height:64px;
  text-shadow:0 1px 2px #0006;box-shadow:0 3px 0 #0004,inset 0 1px 0 #fff2}
.t small{font-size:10px;opacity:.85}

/* ============================================================
   MENÚ DE GRUPOS
   ============================================================ */
.menu-group{padding:8px 12px 4px}
.menu-group h3{margin:8px 0 6px;font-size:14px;color:#ffd23f;
  text-shadow:0 1px 2px #000;border-bottom:1px solid #ffd23f33;padding-bottom:4px}
.bl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.bl button{padding:9px 8px;font-size:12px;text-align:left}

/* ============================================================
   MODAL / POP
   ============================================================ */
#modal{position:fixed;inset:0;display:none;background:#000a;z-index:50;
  overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
#mi{max-width:560px;margin:auto;background:#1a1f30;border-radius:16px;padding:14px;
  box-shadow:0 10px 40px #000a;border:1px solid #3a4166}
#mi h2{margin:0 0 10px;font-size:20px;color:#ffd23f;text-align:center}
#mi h3{margin:12px 0 6px;font-size:15px;color:#ffd23f}
#mi p{margin:6px 0;font-size:14px;line-height:1.5}

/* ============================================================
   CARDS
   ============================================================ */
.card{background:#252b40;border-radius:12px;padding:10px 12px;margin:6px 0;
  font-size:13px;line-height:1.5;border:1px solid #3a4166}
.card b{color:#fff}
.card small{color:#8a90a8}

/* ============================================================
   GRIDS
   ============================================================ */
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.g button{padding:14px 8px;font-size:13px;text-align:center}

/* ============================================================
   NOTIFICACIONES
   ============================================================ */
#notifs{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:70;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:90vw}
.notif{background:linear-gradient(#2a3550,#1a1f30);border:1px solid #4a5a80;
  padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;
  box-shadow:0 4px 14px #000a;animation:notifIn .35s ease-out}
.notif.green{background:linear-gradient(#2fa633,#1a5a20);border-color:#4cd137}
.notif.red{background:linear-gradient(#c0392b,#701a12);border-color:#e74c3c}
@keyframes notifIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   HUD DE JUEGO
   ============================================================ */
#hud{background:#0a1a1a;padding:6px 8px;color:#fff;font-size:12px;
  border-bottom:1px solid #1a3a3a;min-height:44px;display:flex;align-items:center;justify-content:center}
.gt{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px;flex-wrap:nowrap}
.pl{flex:1;min-width:0;padding:4px 6px;background:#1a2a3a;border-radius:8px;transition:background .3s}
.pl.turn-active{background:#2a4a2a;box-shadow:0 0 0 2px #4cd137}
.pl.nm-flash{animation:nmFlash .6s}
@keyframes nmFlash{0%,100%{background:#1a2a3a}50%{background:#4a3a1a}}
.pl-wrap{display:flex;align-items:center;gap:6px}
.obj-ball{width:26px;height:26px;border-radius:50%;background:#333;display:grid;place-items:center;
  font:900 11px system-ui;color:#000;flex-shrink:0}
.obj-ball .num{color:#000}
.nm{font-size:11px;font-weight:700;line-height:1.15}
.sls{margin-top:3px}
.balls-row{display:flex;gap:3px;flex-wrap:wrap}
.nb{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
  font:900 9px system-ui;color:#000;position:relative;opacity:.9}
.nb.met{opacity:.2}
.nb.act{box-shadow:0 0 0 2px #ffd23f}
.nb.pop{animation:ballPop .5s}
.nb.empty{background:#333;color:#666}
@keyframes ballPop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
.rest-count{font-size:10px;color:#8a90a8;margin-top:2px}
.ring{width:38px;height:38px;border-radius:50%;padding:3px;background:#333;
  display:grid;place-items:center;flex-shrink:0}
.av2{width:100%;height:100%;border-radius:50%;background:#1a2a3a;overflow:hidden;
  display:grid;place-items:center;font-size:22px}
.av2 img{width:100%;height:100%;object-fit:cover}
.pot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:0 0 auto;
  min-width:92px;padding:4px 10px;background:linear-gradient(#2a2a14,#1a1a0a);border:1px solid #ffd23f66;
  border-radius:12px;font-weight:900;color:#ffd23f;font-size:11px;text-align:center}
.pot-coins{display:flex;align-items:center;gap:6px;font-size:22px;line-height:1}
.pot-coins span{font-size:22px;filter:drop-shadow(0 0 6px #ffd23f88)}
.pot small{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#d8c27a}

/* ============================================================
   BARRA DE FUERZA
   ============================================================ */
#pwb{position:absolute;left:4px;top:50%;transform:translateY(-50%);
  width:28px;height:180px;background:#000a;border-radius:16px;
  border:2px solid #4a5a80;overflow:visible;z-index:12;touch-action:none;cursor:pointer}
#pwf{position:absolute;bottom:0;left:0;right:0;height:60%;border-radius:14px;
  background:linear-gradient(to top,#4cd137,#ffd23f,#e74c3c);transition:height .08s;pointer-events:none}
#pwbthumbV{position:absolute;left:50%;width:24px;height:24px;margin-left:-12px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dcdcdc 60%,#9a9a9a);
  box-shadow:0 2px 8px #000a;pointer-events:none;display:grid;place-items:center;
  font:900 10px system-ui;color:#222;z-index:2}
#pwblabel{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);
  font:900 10px system-ui;color:#ffd23f;text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:none}

/* ============================================================
   BOTONES DE JUEGO
   ============================================================ */
#gb{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:12}
#gb button{padding:14px 12px;font-size:15px;border-radius:14px;box-shadow:0 3px 0 #0004;
  writing-mode:vertical-rl;text-orientation:mixed;min-height:110px;letter-spacing:1px}
/* Estilos viejos de barra horizontal (ya no se usan, se dejan ocultos por seguridad) */
#pwbar,#pwbfill,#pwbthumb,#pwbtxt{display:none!important}

/* ============================================================
   AIM BAR
   ============================================================ */
#aimb{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:34px;height:180px;background:#0008;border-radius:20px;
  border:1px solid #4a5a80;touch-action:none;z-index:11;overflow:visible}
#aimt{position:absolute;left:50%;top:50%;transform:translateX(-50%);
  margin-top:-20px;width:30px;height:30px;background:#4cd137;border-radius:50%;
  box-shadow:0 0 12px #4cd137;pointer-events:none;transition:margin-top .05s}

/* ============================================================
   MENÚ LATERAL JUEGO
   ============================================================ */
#gm{position:absolute;left:6px;top:58px;width:220px;max-height:calc(100% - 80px);
  overflow-y:auto;background:#1a1f30ee;border:1px solid #3a4166;border-radius:12px;
  padding:8px;z-index:20;display:none;box-shadow:0 8px 24px #000a}
#gm input[type=range]{width:100%}

/* ============================================================
   SPIN (EFECTO)
   ============================================================ */
#sp{position:absolute;right:8px;top:62px;width:110px;height:110px;touch-action:none;
  border-radius:50%;background:#000a;border:2px solid #4a5a80;display:none;z-index:12}
#sp .cross-h,#sp .cross-v{position:absolute;background:#4a5a8055}
#sp .cross-h{left:0;right:0;top:50%;height:1px}
#sp .cross-v{top:0;bottom:0;left:50%;width:1px}
#spd{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 0 8px #fff;left:44px;top:44px;pointer-events:none}
#spd2{position:absolute;width:14px;height:14px;border-radius:50%;background:#4cd137;
  left:50px;top:50px;transform:translate(-50%,-50%);box-shadow:0 0 12px #4cd137;pointer-events:none}

/* ============================================================
   CELEBRACIÓN / FUEGOS
   ============================================================ */
#cele{position:fixed;inset:0;display:none;pointer-events:none;z-index:60}
#cele .txt{position:absolute;left:50%;top:22%;transform:translateX(-50%);
  font:900 clamp(22px,6vw,46px) system-ui;text-align:center;color:#ffd23f;
  text-shadow:0 3px 0 #b8560a,0 0 24px #ff7a00;animation:cartelPop .8s cubic-bezier(.2,1.5,.4,1);white-space:nowrap}
#cele .sub{position:absolute;left:50%;top:34%;transform:translateX(-50%);
  font:900 clamp(14px,3vw,20px) system-ui;color:#fff;text-shadow:0 2px 6px #000;
  animation:cartelPop .8s cubic-bezier(.2,1.5,.4,1) .15s backwards}
.fw{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;
  animation:fwExplode 1.4s ease-out forwards}
@keyframes fwExplode{0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes cartelPop{0%{transform:translateX(-50%) scale(.3);opacity:0}
  60%{transform:translateX(-50%) scale(1.15);opacity:1}
  100%{transform:translateX(-50%) scale(1);opacity:1}}

/* ============================================================
   LOGIN
   ============================================================ */
#login{position:fixed;inset:0;background:linear-gradient(#0e3a5e,#04141f);
  z-index:80;display:none;overflow:hidden}
.felt{position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,#2fa05a44,#0a1a12cc);}
.sil{position:absolute;bottom:0;font-size:60px;opacity:.5}
.bl8{position:absolute;border-radius:50%;display:grid;place-items:center;
  font:900 28px system-ui;color:#111;box-shadow:0 4px 14px #0008;animation:blFloat 4s ease-in-out infinite}
@keyframes blFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.lg-in{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;gap:14px;z-index:2}
.lg-logo{font:900 42px system-ui;font-style:italic;
  background:linear-gradient(#ffd23f,#e08a1e);-webkit-background-clip:text;
  background-clip:text;color:transparent;text-shadow:0 4px 0 #0006}
.lg-pn{position:relative;background:#1a1f30cc;border-radius:14px;padding:50px 20px 14px;
  text-align:center;border:1px solid #ffd23f44;max-width:400px;width:100%}
.lg-pn h3{margin:0;font-size:16px;color:#ffd23f}
.lg-pn small{color:#8a90a8;font-size:12px}
.lg-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:400px}
.lg-row button{flex:1;min-width:100px;padding:12px;font-size:13px}
.lg-note{color:#8a90a8;font-size:11px;text-align:center;max-width:340px}

/* ============================================================
   TUTORIAL
   ============================================================ */
#tut{position:fixed;inset:0;background:#000d;z-index:65;display:none;
  align-items:center;justify-content:center;padding:20px}
#tut .box{background:#1a1f30;border-radius:16px;padding:20px;max-width:400px;width:100%;
  text-align:center;border:2px solid #ffd23f}
#tutarrow{font-size:60px;margin:10px 0}
#tutstep{font-size:12px;color:#8a90a8}
#tuttitle{font-size:20px;color:#ffd23f;font-weight:900;margin:6px 0}
#tuttext{font-size:14px;line-height:1.5;margin:10px 0}

/* ============================================================
   CARTEL DISTRITO
   ============================================================ */
#cartel{position:fixed;inset:0;z-index:26;display:flex;align-items:center;
  justify-content:center;background:#000d;pointer-events:none;transition:opacity .6s}

/* ============================================================
   EMOTES
   ============================================================ */
#emoteLayer{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.emote-float{position:absolute;font-size:42px;animation:emoteRise 2.8s ease-out forwards;
  pointer-events:none;text-shadow:0 2px 8px #000}
@keyframes emoteRise{0%{transform:translateY(0) scale(.6);opacity:0}
  15%{transform:translateY(-20px) scale(1.2);opacity:1}
  100%{transform:translateY(-180px) scale(.9);opacity:0}}

/* ============================================================
   VOTACIÓN / APUESTAS
   ============================================================ */
#votePanel,#betPanel{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
  z-index:40;background:#1a1f30ee;border:1px solid #4a5a80;border-radius:12px;
  padding:8px;display:none;max-width:min(94vw,420px);width:100%;box-shadow:0 6px 20px #000a}
#votePanel.on,#betPanel.on{display:block}
.vote-bar,.bet-bar{position:relative;height:22px;background:#0006;border-radius:6px;overflow:hidden;margin-top:4px}
.vote-bar i,.bet-bar i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#1e4fd8,#4dd2ff);transition:width .3s}
.vote-bar span,.bet-bar span{position:relative;display:block;text-align:center;line-height:22px;
  font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
.vote-btn{width:100%;padding:6px;font-size:12px;margin-top:2px}
.bet-box{font-size:12px}
.bet-opt{display:flex;align-items:center;gap:6px;margin:4px 0}
.bet-pool{background:#000a;padding:3px 8px;border-radius:6px;font-weight:900;color:#ffd23f;font-size:11px}

/* ============================================================
   REPLAY / 3D
   ============================================================ */
#replayBar,#r3dPanel{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);
  z-index:40;background:#1a1f30ee;border:1px solid #4a5a80;border-radius:12px;
  padding:8px;display:none;max-width:96vw;width:min(96vw,520px);box-shadow:0 6px 20px #000a}
#replayBar.on,#r3dPanel.on{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#replayBar button,#r3dPanel button{padding:6px 10px;font-size:12px}
#replayBar input[type=range],#r3dPanel input[type=range]{flex:1;min-width:80px}

/* ============================================================
   TORNEO
   ============================================================ */
#torneoPanel{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
  z-index:40;background:#1a1f30ee;border:1px solid #4a5a80;border-radius:12px;
  padding:8px;display:none;max-width:96vw;width:min(96vw,720px);box-shadow:0 6px 20px #000a}
#torneoPanel.on{display:block}
.torneo-match{background:#252b40;border-radius:8px;padding:6px;margin:4px 0;font-size:11px;
  display:flex;justify-content:space-between;align-items:center;min-height:52px}
.torneo-match.win{background:#1a4a2a;border:1px solid #4cd137}
.torneo-match.live{background:#4a1a1a;border:1px solid #e74c3c;animation:pulseLive 1.2s infinite}
@keyframes pulseLive{0%,100%{opacity:1}50%{opacity:.7}}

/* ============================================================
   SWISS
   ============================================================ */
.swiss-round{background:#252b40;border-radius:10px;padding:8px;margin:6px 0}
.swiss-pairing{display:flex;justify-content:space-between;align-items:center;
  font-size:13px;padding:4px 6px;border-radius:6px}
.swiss-pairing:nth-child(odd){background:#1a1f30}
.swiss-score{color:#ffd23f;font-weight:900}
.swiss-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.swiss-table th{background:#1a1f30;padding:6px;color:#ffd23f;font-weight:900}
.swiss-table td{padding:6px;border-bottom:1px solid #3a4166}
.swiss-table tr.live{background:#2a4fa8}

/* ============================================================
   EXPRESS
   ============================================================ */
.express-bar{display:flex;justify-content:space-between;padding:8px;
  background:#1a1f30;border-radius:10px;font-size:13px;font-weight:900;margin:6px 0}
.express-bar.hot{background:linear-gradient(90deg,#c0392b,#8a1010);animation:pulseLive 1.2s infinite}
.express-clock{text-align:center;font:900 42px system-ui;color:#ffd23f;margin:8px 0;
  text-shadow:0 3px 0 #b8560a}

/* ============================================================
   ELO / STATS
   ============================================================ */
.elo-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:900;
  font-size:12px;color:#fff}
.elo-badge.bronce{background:linear-gradient(#a86b3e,#6a3a12)}
.elo-badge.plata{background:linear-gradient(#c9c9c9,#8a8a8a);color:#222}
.elo-badge.oro{background:linear-gradient(#ffd23f,#b8860b);color:#222}
.elo-badge.platino{background:linear-gradient(#8ff,#2a9a9a);color:#222}
.elo-badge.diamante{background:linear-gradient(#4dd2ff,#0066aa)}
.elo-badge.maestro{background:linear-gradient(#b34eff,#6a1b9a)}
.elo-badge.granmaestro{background:linear-gradient(#ffd23f,#ff00ff);color:#000}
.elo-change.up{color:#4cd137}
.elo-change.down{color:#e74c3c}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.stat-box{background:#252b40;border-radius:10px;padding:8px;text-align:center;border:1px solid #3a4166}
.stat-box .big{display:block;font:900 22px system-ui;color:#ffd23f}
.stat-box small{font-size:10px;color:#8a90a8;display:block;margin-top:2px}
.stat-bar{background:#0006;border-radius:6px;height:10px;overflow:hidden;margin:4px 0}
.stat-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#e08a1e);transition:width .4s}

/* ============================================================
   TACOS
   ============================================================ */
.taco-item{position:relative;overflow:hidden}
.taco-preview{position:relative;height:56px;display:grid;place-items:center;margin:4px 0;
  background:#00000033;border-radius:8px;padding:4px;overflow:hidden}
.taco-preview svg{width:100%;height:100%;max-height:48px}
.taco-preview.nv4{filter:drop-shadow(0 0 6px #ffd23f)}
.taco-preview.nv5{filter:drop-shadow(0 0 10px #ff00ff) drop-shadow(0 0 20px #ffd23f)}
.taco-preview.exclusivo{filter:drop-shadow(0 0 8px #ffd700)}

let AC = null, MUTE = false, LS_ = {}, VOL = .8;
try{ MUTE = localStorage.getItem('b8m') == '1'; }catch(e){}
try{ VOL = +(localStorage.getItem('b8v') || .8); }catch(e){}

function ac(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state == 'suspended') AC.resume();
  return AC;
}
function snd(t, v){
  if(t == 'rail' && G && G.fh != null) G.rl = 1;
  if(MUTE) return;
  const a = ac(); if(!a) return;
  const n = a.currentTime, now = Date.now();
  if(now - (LS_[t] || 0) < 35) return;
  LS_[t] = now;
  v = Math.max(.15, Math.min(1, v || 1)) * Math.max(.02, VOL);
  const tone = (f, d, ty, vol, f2, dl) => {
    dl = dl || 0;
    const o = a.createOscillator(), g = a.createGain();
    o.type = ty;
    o.frequency.setValueAtTime(f, n + dl);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, n + dl + d);
    g.gain.setValueAtTime(vol * v, n + dl);
    g.gain.exponentialRampToValueAtTime(.001, n + dl + d);
    o.connect(g); g.connect(a.destination);
    o.start(n + dl); o.stop(n + dl + d);
  };
  const noise = (d, vol, fr) => {
    const b = a.createBuffer(1, Math.floor(a.sampleRate * d), a.sampleRate);
    const c = b.getChannelData(0);

let AMB_TIMER = null;
function ambStart(dist){
  ambStop();
  if(MUTE) return;
  const cfg = AMB[dist] || AMB[0];
  const a = ac(); if(!a) return;
  let idx = 0;
  AMB_TIMER = setInterval(() => {
    if(MUTE || !a) return;
    const note = cfg.notes[idx % cfg.notes.length] * (idx < cfg.notes.length * 2 ? 1 : 1.5);
    const n = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = cfg.pad;
    o.frequency.value = note;
    g.gain.setValueAtTime(0, n);
    g.gain.linearRampToValueAtTime(.05 * VOL, n + .05);
    g.gain.exponentialRampToValueAtTime(.001, n + (60 / cfg.bpm) * .9);
    o.connect(g); g.connect(a.destination);
    o.start(n); o.stop(n + (60 / cfg.bpm));
    if(idx % 4 === 0){
      const ob = a.createOscillator(), gb = a.createGain();
      ob.type = 'sine';
      ob.frequency.value = note / 2;
      gb.gain.setValueAtTime(0, n);
      gb.gain.linearRampToValueAtTime(.07 * VOL, n + .08);
      gb.gain.exponentialRampToValueAtTime(.001, n + (60 / cfg.bpm) * 3.6);
      ob.connect(gb); gb.connect(a.destination);
      ob.start(n); ob.stop(n + (60 / cfg.bpm) * 3.8);
    }
    idx++;
  }, (60 / cfg.bpm) * 1000);
  notif('🎵 ' + cfg.n, '');
}
function ambStop(){ clearInterval(AMB_TIMER); AMB_TIMER = null; }

   El tercer valor 1 marca posiciones estimadas por vecindad (sin coordenada publicada a mano). */

  [-24.0853,-57.0875],      /*  0 San Pedro del Ycuamandiyú */
  [-24.0853,-57.2022],      /*  1 Antequera */

  [-24.62,-56.18,1]         /* 20 Yrybucuá */
];
/* Contorno simplificado del departamento (lat, lon). Oeste = río Paraguay. */
const MAPA_BORDE = [
  [-23.36,-57.38],[-23.34,-57.00],[-23.33,-56.60],[-23.38,-56.20],[-23.50,-55.90],[-23.62,-55.78],
  [-24.00,-55.80],[-24.40,-55.82],[-24.75,-55.88],[-24.98,-56.00],
  [-25.02,-56.40],[-24.98,-56.80],[-24.88,-57.10],[-24.76,-57.30],
  [-24.45,-57.36],[-24.10,-57.36],[-23.75,-57.44],[-23.45,-57.40]
];
const MAPA_RIO = [[-24.76,-57.30],[-24.45,-57.36],[-24.10,-57.36],[-23.75,-57.44],[-23.45,-57.40]];
const MAPA_BOX = { lat0:-23.15, lat1:-25.15, lon0:-57.65, lon1:-55.60 };
const MAPA_K = Math.cos(24.2 * Math.PI / 180);
const MAPA_W = (MAPA_BOX.lon1 - MAPA_BOX.lon0) * MAPA_K * 100;
const MAPA_H = (MAPA_BOX.lat0 - MAPA_BOX.lat1) * 100;
const mapaXY = (lat, lon) => [ (lon - MAPA_BOX.lon0) * MAPA_K * 100, (MAPA_BOX.lat0 - lat) * 100 ];
const MAPA_POS = MAPA_GEO.map(g => { const q = mapaXY(g[0], g[1]); return { x:q[0] / MAPA_W * 100, y:q[1] / MAPA_H * 100 }; });
let MAPA_Z = 1.25;
function mapaZoom(d){
  const w = $('mapaw');
  const fx = w ? (w.scrollLeft + w.clientWidth / 2) / (w.scrollWidth || 1) : .5;
  const fy = w ? (w.scrollTop + w.clientHeight / 2) / (w.scrollHeight || 1) : .5;
  MAPA_Z = Math.max(1, Math.min(3, MAPA_Z + d));
  mapaM();
  const n = $('mapaw');
  if(n){ n.scrollLeft = fx * n.scrollWidth - n.clientWidth / 2; n.scrollTop = fy * n.scrollHeight - n.clientHeight / 2; }
}
function mapaM(){
  const totalStars = Object.values(S.stars || {}).reduce((a, b) => a + b, 0);
  const maxStars = V.length * 3;
  const pts = a => a.map(g => mapaXY(g[0], g[1]).map(n => n.toFixed(1)).join(',')).join(' ');
  let grat = '';
  for(const la of [-23.5, -24, -24.5, -25]){ const y = mapaXY(la, 0)[1]; grat += `<line x1="0" y1="${y}" x2="${MAPA_W}" y2="${y}" stroke="#ffffff14" stroke-width=".3"/><text x="1.5" y="${y - 1}" font-size="2.6" fill="#ffffff55">${Math.abs(la)}°S</text>`; }
  for(const lo of [-57, -56.5, -56]){ const x = mapaXY(0, lo)[0]; grat += `<line x1="${x}" y1="0" x2="${x}" y2="${MAPA_H}" stroke="#ffffff14" stroke-width=".3"/><text x="${x + 1}" y="${MAPA_H - 1.5}" font-size="2.6" fill="#ffffff55">${Math.abs(lo)}°O</text>`; }
  const vec = (t, lat, lon, rot, col) => { const q = mapaXY(lat, lon); return `<text transform="translate(${q[0].toFixed(1)},${q[1].toFixed(1)})${rot ? ' rotate(-90)' : ''}" font-size="3" fill="${col || '#8fd9a8aa'}" text-anchor="middle" font-style="italic">${t}</text>`; };
  const alto = Math.round(430 * MAPA_Z);
  M(`<h2>🗺️ Mapa de San Pedro</h2>
    <p style="font-size:12px;color:#8a90a8;text-align:center;margin:4px 0">Tocá cada distrito para jugar. Los bloqueados se desbloquean con 🏆.</p>
    <div style="display:flex;gap:6px;justify-content:center;margin:6px 0">
      <button class=b5 style="padding:6px 12px" onclick="mapaZoom(-.6)">➖</button>
      <button class=b5 style="padding:6px 12px" onclick="mapaZoom(.6)">➕ Acercar</button>
    </div>
    <div id=mapaw style="overflow:auto;max-height:62vh;border:2px solid #2fa633;border-radius:14px;background:radial-gradient(circle at 50% 50%,#17324a,#0a1620)">
      <div id=mapa style="position:relative;height:${alto}px;width:${Math.round(alto * MAPA_W / MAPA_H)}px;margin:0 auto">
        <svg viewBox="0 0 ${MAPA_W.toFixed(1)} ${MAPA_H.toFixed(1)}" style="position:absolute;inset:0;width:100%;height:100%">
          ${grat}
          <polygon points="${pts(MAPA_BORDE)}" fill="#14402a" stroke="#2fa633" stroke-width=".7" stroke-linejoin="round"/>
          <polyline points="${pts(MAPA_RIO)}" fill="none" stroke="#4dd2ff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
          ${vec('Río Paraguay', -24.10, -57.52, 1, '#4dd2ffcc')}
          ${vec('PRESIDENTE HAYES', -24.10, -57.60, 1)}
          ${vec('CONCEPCIÓN', -23.22, -56.60)}
          ${vec('AMAMBAY', -23.55, -55.66, 1)}
          ${vec('CANINDEYÚ', -24.40, -55.66, 1)}
          ${vec('CAAGUAZÚ', -25.10, -56.10)}
          ${vec('CORDILLERA', -25.10, -56.85)}
        </svg>
        ${V.map((v, i) => {
          const p = MAPA_POS[i];
          const lk = S.tr < v.req;
          const st = getStars(i);
          const bg = lk ? '#333' : `linear-gradient(${PAL[i % 6][0]},${PAL[i % 6][1]})`;
          return `<div onclick="${lk ? '' : `X();play(${i})`}" style="position:absolute;left:${p.x}%;top:${p.y}%;transform:translate(-50%,-50%);cursor:${lk ? 'not-allowed' : 'pointer'};text-align:center;z-index:2">
            <div style="width:24px;height:24px;border-radius:50%;background:${bg};border:2px solid ${st >= 1 ? '#ffd23f' : lk ? '#555' : '#fff'};display:grid;place-items:center;font-size:12px;box-shadow:0 2px 6px #0008;${lk ? 'opacity:.5' : ''}">${lk ? '🔒' : (ESCUDOS[i] ? ESCUDOS[i].s : '🎱')}</div>
            <div style="font-size:8px;color:${lk ? '#9aa' : '#fff'};margin-top:1px;text-shadow:0 1px 2px #000,0 0 3px #000;max-width:62px;line-height:1.1;font-weight:700">${CI[i][1].length > 11 ? CI[i][1].slice(0, 10) + '.' : CI[i][1]}</div>
            <div style="font-size:8px;color:#ffd23f">${st > 0 ? '⭐'.repeat(st) : ''}</div>
          </div>`;
        }).join('')}
        <div style="position:absolute;top:6px;right:8px;font-size:16px;color:#ffffffaa;z-index:1">🧭 N</div>
      </div>
    </div>
    <div style="margin-top:6px;font-size:10px;color:#8a90a8;text-align:center">📍 Cada punto está en la ubicación geográfica de la cabecera del distrito. Contorno simplificado del departamento.</div>
    <div style="margin:6px 0;font-size:11px;color:#ffd23f;text-align:center">⭐ ${totalStars}/${maxStars}</div>
    <div class=card style="margin-top:4px;font-size:12px;text-align:center">
      <b>Progreso:</b> ${V.filter((v, i) => S.tr >= v.req).length} de 21 desbloqueados<br>
      <b>Completados:</b> ${V.filter((v, i) => getStars(i) >= 1).length} distritos con al menos 1⭐<br>
      <b>Perfectos (3⭐):</b> ${V.filter((v, i) => getStars(i) === 3).length}
    </div>`);
}

/* ============================================================
   ESTRELLAS / RÉCORDS
   ============================================================ */
function getStars(dist){ return S.stars[dist] || 0; }
function calcStars(shots, pk){ if(shots <= 3) return 3; if(shots <= 5) return 2; if(shots <= 8) return 1; return 1; }
function setStars(dist, stars){ if(stars > getStars(dist)){ S.stars[dist] = stars; save(); return true; } return false; }
function recordTime(dist, ms, won){
  if(!won) return;
  S.recs = S.recs || {};
  const prev = S.recs[dist];
  if(!prev || ms < prev.ms){ S.recs[dist] = { ms, t: Date.now(), n: S.name }; save(); return true; }
  return false;
}
function recsM(){
  S.recs = S.recs || {};
  const filas = V.map((v, i) => {
    const r = S.recs[i];
    const st = getStars(i);
    if(!r) return `<div class=card>${CI[i][1]}<br>${starsHTML(st)}<br><small style="opacity:.5">Sin récord de tiempo</small></div>`;
    return `<div class=card><b>${CI[i][1]}</b><br>${starsHTML(st)}<br>🏁 ${(r.ms / 1000).toFixed(2)}s · ${r.n}<br><small>${new Date(r.t).toLocaleDateString()}</small></div>`;
  }).join('');
  M('<h2>⏱️ Récords por distrito</h2>' + filas);
}

function play(i){

function colorTacoEvolucionado(i, parte){
  const base = TACO_STYLES[i] || TACO_STYLES[0];
  const colores = { puntera: base[0], virola: base[1], cuerpo: base[2] };
  const n = getNivelTaco(i);
  if(n === 1) return colores[parte];
  const p = (n - 1) / 4;
  const objetivo = {
    puntera: n >= 4 ? '#ffd700' : '#ffffff',
    virola: n >= 3 ? '#ffd700' : '#ffec8b',
    cuerpo: n >= 4 ? mezclarColor(colores.cuerpo, '#8b4513', 0.3) : colores.cuerpo
  }[parte];
  return mezclarColor(colores[parte], objetivo, p);
}
function mezclarColor(c1, c2, p){
  const h = s => parseInt(s.slice(1), 16);
  const r1 = (h(c1) >> 16) & 255, g1 = (h(c1) >> 8) & 255, b1 = h(c1) & 255;
  const r2 = (h(c2) >> 16) & 255, g2 = (h(c2) >> 8) & 255, b2 = h(c2) & 255;
  const r = Math.round(r1 * (1 - p) + r2 * p), g = Math.round(g1 * (1 - p) + g2 * p), b = Math.round(b1 * (1 - p) + b2 * p);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* ============================================================

   ============================================================ */
function inicializarTacoStats(){
  S.tacoStats = S.tacoStats || {};
  if(!S.tacoStats[S.cue]){
    S.tacoStats[S.cue] = { partidas:0, wins:0, losses:0, shots:0, pocketed:0, mejorRacha:0, rachaActual:0, tiempoTotal:0, xp:0 };
  }
}
inicializarTacoStats();
function getNivelTaco(i){
  inicializarTacoStats();
  const t = S.tacoStats[i] || { xp:0 };
  const xp = t.xp || 0;
  let nivel = 1;
  for(let k = NIVELES_TACO.length - 1; k >= 0; k--){
    if(xp >= NIVELES_TACO[k].xp){ nivel = NIVELES_TACO[k].n; break; }
  }
  return nivel;
}
function getNivelTacoObj(i){
  const n = getNivelTaco(i);
  return NIVELES_TACO.find(x => x.n === n) || NIVELES_TACO[0];
}
function xpSiguienteNivel(i){
  const actual = getNivelTaco(i);
  if(actual >= 5) return null;
  const sig = NIVELES_TACO.find(x => x.n === actual + 1);
  return sig ? { necesario:sig.xp, actual:S.tacoStats[i]?.xp || 0, siguiente:sig } : null;
}
function getStatsTaco(i){
  const base = CUES[i];
  if(!base) return { pw:1, aim:0 };
  const lvl = getNivelTacoObj(i);
  const manual = (S.cu || {})[i] || 0;
  return {
    pw: base.pw * lvl.pw * (1 + .03 * manual),
    aim: base.aim * lvl.aim * (1 + .08 * manual),
    nivel: lvl.n,
    nivelNombre: lvl.nombre,
    nivelIcon: lvl.icon
  };
}
function ganarXPTaco(i, xp){
  inicializarTacoStats();
  const taco = CUES[i];
  const mult = taco?.exclusivo ? 1.5 : 1;
  xp = Math.round(xp * mult);
  const antes = getNivelTaco(i);
  const t = S.tacoStats[i] || { partidas:0, wins:0, losses:0, shots:0, pocketed:0, mejorRacha:0, rachaActual:0, tiempoTotal:0, xp:0 };
  t.xp = (t.xp || 0) + xp;
  S.tacoStats[i] = t;
  save();
  const despues = getNivelTaco(i);
  if(despues > antes){
    setTimeout(() => mostrarSubidaNivel(i, antes, despues), 600);
    return true;
  }

const TCE = {};
function tableImgEscudo(dist){
  const k = dist % 21;
  if(TCE[k]) return TCE[k];
  const base = tableImg(dist % TH.length);
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 400;
  const c = canvas.getContext('2d');
  c.drawImage(base, 0, 0, 800, 400);
  c.save();
  c.globalAlpha = 0.12;
  dibujarEscudo(c, 400, 200, 90, dist);
  c.restore();
  return TCE[k] = canvas;
}
function dibujarEscudo(ctx, x, y, r, dist){
  const e = ESCUDOS[dist % 21];
  if(!e) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x - r, y - r * 0.8);
  ctx.lineTo(x + r, y - r * 0.8);
  ctx.lineTo(x + r, y + r * 0.3);
  ctx.quadraticCurveTo(x + r, y + r, x, y + r * 1.1);
  ctx.quadraticCurveTo(x - r, y + r, x - r, y + r * 0.3);
  ctx.closePath();
  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  g.addColorStop(0, e.c[0]); g.addColorStop(1, e.c[1]);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.floor(r * 0.9) + 'px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e.n, x, y);
  ctx.font = Math.floor(r * 0.8) + 'px system-ui';
  ctx.fillText(e.s, x, y - r * 1.3);
  ctx.restore();
}

function scatter(){
  const b = [{ n:0, x:200, y:200, vx:0, vy:0, a:1 }];
  for(let i = 1; i <= 6; i++){
    let x, y;
    do { x = 300 + Math.random() * 440; y = 70 + Math.random() * 260; }
    while(b.some(q => Math.hypot(q.x - x, q.y - y) < 26));
    b.push({ n:i, x, y, vx:0, vy:0, a:1 });
  }
  return b;
}
function resp(n){
  const b = G.balls.find(q => q.n == n);
  b.a = 1; b.vx = b.vy = 0; b.x = 560; b.y = 200;
  while(G.balls.some(q => q != b && q.a && Math.hypot(q.x - b.x, q.y - b.y) < 2 * R)){
    b.x += 22;
    if(b.x > 730){ b.x = 560; b.y += 22; }
  }
}

   ============================================================ */
function shoot(a, pw){
  snd('cue', pw);
  const c = G.balls[0];
  const stats = getStatsTaco(S.cue);
  const h = G.hh != null ? G.hh : (G.turn == 0 || G.cfg.mode == 'friends' || G.online ? stats.pw : 1);
  const v = pw * 22 * h;
  c.vx = Math.cos(a) * v;
  c.vy = Math.sin(a) * v;
  G.moving = true;
  G.pk = [];
  G.fh = null;
  G.rl = 0;
  G.re = null;
  G.rec = [];
  G.msg = '';
  const hum = G.turn == 0 || G.cfg.mode == 'friends' || G.online;
  G.dir = [Math.cos(a), Math.sin(a)];
  G.sv = v;
  G.spUse = hum ? G.sp : [0,0];
  G.spinP = !!(G.spUse[0] || G.spUse[1]);
  G.sp = [0,0];
  updSpin();
}
function step(){
  const bs = G.balls;
  if(G.rec && G.rec.length < 900) G.rec.push(bs.map(b => [b.x, b.y, b.a ? 1 : 0]));
  for(let s = 0; s < 5; s++){
    for(const b of bs){
      if(!b.a) continue;
      if(b === bs[0] && b.pv && G.spUse && (b.x < 55 || b.x > 745 || b.y < 55 || b.y > 345)){
        if(G.re == null) G.re = G.spUse[0];
        if(G.re && (b.pv[0] * b.vx < -.01 || b.pv[1] * b.vy < -.01)){
          const k = G.re * Math.hypot(b.vx, b.vy) * .3;
          if(b.pv[0] * b.vx < -.01) b.vy += (b.x < 400 ? -1 : 1) * k;
          else b.vx += (b.y < 200 ? 1 : -1) * k;
          G.re *= .5;
        }
      }
      b.pv = [b.vx, b.vy];
      b.x += b.vx / 5;
      b.y += b.vy / 5;
      b.vx *= .9965;
      b.vy *= .9965;
      for(const p of P){
        if(Math.hypot(b.x - p[0], b.y - p[1]) < 19){
          b.a = 0; b.vx = b.vy = 0;
          G.pk.push(b.n);
          if(G.hs && b.n > 0) G.hp = (G.hp || 0) + 1;
          fxAdd(p[0], p[1]);
          vib(25);
          if(b.n == 8) G.p8 = P.indexOf(p);
          snd('pocket', 1);
          break;
        }
      }
      if(!b.a) continue;
      if(!P.some(p => Math.hypot(b.x - p[0], b.y - p[1]) < 30)){
        if(b.x < 40 + R){ b.x = 40 + R; b.vx = -b.vx * .8; snd('rail', Math.hypot(b.vx, b.vy) / 12); if(b === bs[0]) G.rl = (G.rl || 0) + 1; }
        if(b.x > 760 - R){ b.x = 760 - R; b.vx = -b.vx * .8; snd('rail', Math.hypot(b.vx, b.vy) / 12); if(b === bs[0]) G.rl = (G.rl || 0) + 1; }
        if(b.y < 40 + R){ b.y = 40 + R; b.vy = -b.vy * .8; snd('rail', Math.hypot(b.vx, b.vy) / 12); if(b === bs[0]) G.rl = (G.rl || 0) + 1; }
        if(b.y > 360 - R){ b.y = 360 - R; b.vy = -b.vy * .8; snd('rail', Math.hypot(b.vx, b.vy) / 12); if(b === bs[0]) G.rl = (G.rl || 0) + 1; }
      }
    }
    for(let i = 0; i < bs.length; i++)
      for(let j = i + 1; j < bs.length; j++){
        const a = bs[i], b = bs[j];
        if(!a.a || !b.a) continue;
        let dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
        if(d < 2 * R && d > 0){
          if(i == 0 && G.fh == null) G.fh = b.n;
          dx /= d; dy /= d;
          const o = (2 * R - d) / 2;
          a.x += dx * o; a.y += dy * o;
          b.x -= dx * o; b.y -= dy * o;
          const dv = (a.vx - b.vx) * dx + (a.vy - b.vy) * dy;
          if(dv < 0){
            snd('hit', -dv / 12);
            a.vx -= dv * dx; a.vy -= dv * dy;
            b.vx += dv * dx; b.vy += dv * dy;
            if(i == 0 && G.spinP){
              G.spinP = false;
              const q = G.spUse, k = G.sv;
              a.vx += G.dir[0] * (-q[1]) * k * .45 - G.dir[1] * q[0] * k * .2;
              a.vy += G.dir[1] * (-q[1]) * k * .45 + G.dir[0] * q[0] * k * .2;
            }
          }
        }
      }
  }
  let mv = false;
  for(const b of bs){
    if(!b.a) continue;
    if(Math.hypot(b.vx, b.vy) < .03){ b.vx = b.vy = 0; }
    else mv = true;
  }
  if(!mv) settle();
}

   SETTLE

function own(n, t){
  const g = G.groups[t];
  return g == 's' ? (n >= 1 && n <= 7) : g == 't' ? (n >= 9) : (n != 8);
}
function respawn(){
  const c = G.balls[0];
  c.a = 1; c.vx = c.vy = 0; c.x = 200; c.y = 200;
  while(G.balls.some(b => b != c && b.a && Math.hypot(b.x - c.x, b.y - c.y) < 2 * R)) c.y += 22;
}
function settle(){
  G.moving = false;
  const m = G.cfg.mode, t = G.turn, pk = G.pk, cueP = !G.balls[0].a, real = pk.filter(n => n > 0);
  if(cueP) respawn();
  const br = G.brk;
  G.brk = false;
  if(br && real.includes(8) && (m == 'vs' || m == 'friends')){
    G.balls = rack();
    G.tt = Date.now();
    hud();
    if(m == 'vs' && G.turn == 1) setTimeout(bot, 900);
    return;
  }
  if(t == 0 || m == 'friends' || m == 'practice') S.pot += real.length;
  if(m == 'practice'){
    G.pc += real.length;
    if(real.includes(8)) resp(8);
    hud();
    save();
    return;
  }
  if(m == 'event' || m == 'lucky'){
    G.got += real.length;
    G.shots--;
    hud();
    if(G.got >= G.cfg.target){ S.coins += G.cfg.prize; save(); return fin('¡Ganaste!', `+${G.cfg.prize} 🪙`, true); }
    if(G.shots <= 0) return fin('Sin tiros', 'Intentá de nuevo', false);
    return;
  }
  if(m == 'tresbandas'){
    let bandas = G.rl || 0;
    const emb = real.length;
    let reward = 0, msg = '';
    if(bandas >= 3 && emb >= 1){ reward = 200; msg = '¡3 bandas + embocada! 🎯'; }
    else if(bandas >= 2 && emb >= 1){ reward = 80; msg = '2 bandas + embocada'; }
    else if(bandas >= 1 && emb >= 1){ reward = 30; msg = '1 banda + embocada'; }
    else if(emb >= 2){ reward = emb * 20; msg = emb + ' bolas sin banda'; }
    else if(emb >= 1){ reward = 15; msg = '1 bola'; }
    G.got += emb;
    G.shots--;
    if(reward > 0){ S.coins += reward; S.earn = (S.earn || 0) + reward; }
    if(reward > 0) notif('🎯 ' + msg + ' · +' + reward + ' 🪙', 'green');
    hud();
    if(G.shots <= 0) return fin('🎮 3 Bandas terminado', `Total embocadas: ${G.got}<br>Recompensa final: <b>+${reward} 🪙</b>`, true);
    return;
  }
  if(m == 'carambola'){
    const emb = real.length;
    const reward = emb >= 3 ? 500 : emb >= 2 ? 150 : emb >= 1 ? 40 : 0;
    if(reward > 0){ S.coins += reward; S.earn = (S.earn || 0) + reward; }
    save();
    if(emb >= 3) celebrate(S.name);
    return fin(emb >= 3 ? '🎯 ¡Carambola perfecta!' : '🎮 Carambola', `Embocadas: ${emb}<br>${reward ? '+' + reward + ' 🪙' : 'Sin premio'}`, emb >= 2);
  }
  if(m == 'nine'){
    real.forEach(n => { if(n > 0 && !G.pocketed[t].includes(n)){ G.pocketed[t].push(n); snd(n === 9 ? 'marker9' : 'marker', .7); } });
    const al9 = G.balls.filter(b => b.n > 0 && (b.a || pk.includes(b.n))), low = Math.min(...al9.map(b => b.n));
    let foul = cueP || G.fh == null || G.fh != low || (!pk.length && !G.rl);
    if(pk.includes(9)){
      if(!foul) return end9(t);
      resp(9);
      foul = true;
    }
    const good = real.some(n => n != 9);
    G.bih = foul;
    if(foul || !good) G.turn = 1 - t;
    G.tt = Date.now();
    hud();
    if(G.turn == 1 && !G.online) setTimeout(bot, 900);
    return;
  }
  const g = G.groups[t];
  let rem = 0;
  if(g) for(const b of G.balls) if(b.a && b.n != 8 && own(b.n, t)) rem++;
  const cleared = g && rem == 0;
  if(pk.includes(8)){
    const win = !cueP && cleared && G.fh != null && (G.call == null || G.call == G.p8);
    return end(win ? t : 1 - t);
  }
  let foul = cueP || G.fh == null || (!pk.length && !G.rl);
  if(!foul){
    if(G.fh == 8) foul = !cleared;
    else if(g) foul = !own(G.fh, t);
  }
  if(!foul && !g){
    const f = real[0];
    if(f){
      G.groups[t] = f < 8 ? 's' : 't';
      G.groups[1 - t] = f < 8 ? 't' : 's';
    }
  }
  const opp = G.groups[t] ? real.filter(n => n != 8 && !own(n, t)) : [];
  opp.forEach(n => {
    const b = G.balls.find(q => q.n == n);
    b.a = 1; b.vx = b.vy = 0; b.x = 560; b.y = 200;
    while(G.balls.some(q => q != b && q.a && Math.hypot(q.x - b.x, q.y - b.y) < 2 * R)){
      b.x += 22;
      if(b.x > 730){ b.x = 560; b.y += 22; }
    }
  });
  if(opp.length) foul = true;
  const good = real.some(n => own(n, t));
  if(real.some(n => own(n, t))) snd('marker', .7);
  G.bih = foul;
  G.call = null;
  if(foul || !good) G.turn = 1 - t;
  G.tt = Date.now();
  hud();
  if((m == 'vs' || m == 'nine') && G.turn == 1 && !G.online) setTimeout(bot, 900);
}

/* ============================================================
   IA DEL BOT
   ============================================================ */
function blocked(x1, y1, x2, y2, ex){
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy || 1;
  for(const b of G.balls){
    if(!b.a || b.n == 0 || b == ex) continue;
    let u = ((b.x - x1) * dx + (b.y - y1) * dy) / l2;
    u = Math.max(0, Math.min(1, u));
    if(Math.hypot(b.x - x1 - u * dx, b.y - y1 - u * dy) < 19) return 1;
  }
  return 0;
}
function bot(){
  if(!G || G.over || G.turn != 1 || G.moving) return;
  if(G.pz) return void setTimeout(bot, 500);
  if(Math.random() < 0.3){
    const k = Math.random() < 0.5 ? 'ganando' : 'perdiendo';
    hablar(fBot(k, ''), { rate:1.05, pitch:1.1 });
  }
  const bs = G.balls, c = bs[0], g = G.groups[1];
  const al = bs.filter(b => b.a && b.n > 0);
  let o = al.filter(b => b.n != 8 && own(b.n, 1));
  if(g && !o.length) o = al.filter(b => b.n == 8);
  if(G.cfg.mode == 'nine'){
    const l = Math.min(...al.map(b => b.n));
    o = al.filter(b => b.n == l);
  }
  if((G.cfg.mode == 'vs' || G.cfg.mode == 'friends') && G.groups[1] && !bs.some(b => b.a && b.n > 0 && b.n != 8 && own(b.n, 1)) && bs.some(b => b.a && b.n == 8)){
    const b8 = bs.find(b => b.n == 8);
    let best = null;
    for(let i = 0; i < P.length; i++){
      const p = P[i], dx = p[0] - b8.x, dy = p[1] - b8.y, dl = Math.hypot(dx, dy) || 1;
      const gx = b8.x - dx / dl * 20, gy = b8.y - dy / dl * 20;
      const vx = gx - c.x, vy = gy - c.y, vl = Math.hypot(vx, vy) || 1;
      if(blocked(c.x, c.y, gx, gy, b8) || blocked(b8.x, b8.y, p[0], p[1], b8)) continue;
      const cos = (vx * dx + vy * dy) / (vl * dl);
      if(cos < .2) continue;
      const sc = vl + dl - cos * 260;
      if(!best || sc < best.sc) best = { sc, a:Math.atan2(vy, vx), pw:Math.min(1, .35 + (vl + dl) / 1100), tr:i };
    }
    if(best){
      G.call = best.tr;
      hud();
      return shoot(best.a + (Math.random() - .5) * G.noise * 2, best.pw);
    }
    let near = 0, nd = 1e9;
    P.forEach((p, i) => { const d = Math.hypot(p[0] - b8.x, p[1] - b8.y); if(d < nd){ nd = d; near = i; } });
    G.call = near;
    hud();
    const a = Math.atan2(b8.y - c.y, b8.x - c.x);
    return shoot(a + (Math.random() - .5) * G.noise * 2, .5);
  }
  let best = null;
  for(const t of o)
    for(const p of P){
      const dx = p[0] - t.x, dy = p[1] - t.y, dl = Math.hypot(dx, dy);
      const gx = t.x - dx / dl * 20, gy = t.y - dy / dl * 20;
      const vx = gx - c.x, vy = gy - c.y, vl = Math.hypot(vx, vy);
      const cs = (vx * dx + vy * dy) / (vl * dl);
      if(cs < .35 || blocked(c.x, c.y, gx, gy, t) || blocked(t.x, t.y, p[0], p[1], t)) continue;
      const sc = vl + dl - cs * 300;
      if(!best || sc < best.sc) best = { sc, a:Math.atan2(vy, vx), pw:Math.min(1, .3 + (vl + dl) / 1100) };
    }
  if(!best){
    const t = o[0] || al[0];
    best = { a:Math.atan2(t.y - c.y, t.x - c.x), pw:.35 };
  }
  shoot(best.a + (Math.random() - .5) * G.noise * 2, best.pw);
}

  }
  const sph = ctx.createRadialGradient(b.x - R * .35, b.y - R * .35, R * .15, b.x, b.y, R * 1.1);

  const hl = ctx.createRadialGradient(b.x - R * .42, b.y - R * .42, 0, b.x - R * .42, b.y - R * .42, R * .55);

  let y = (ev.clientY - r.top - r.height / 2) / (r.height / 2);

function fit(){
  // Overlay de orientación: mostrar solo en portrait y si el usuario no eligió continuar
  try{
    const isPortrait = (window.matchMedia && window.matchMedia('(orientation: portrait)').matches) || (innerHeight > innerWidth);
    const rotEl = $('rot');
    if(rotEl) rotEl.style.display = (isPortrait && !ROTOK) ? 'flex' : 'none';
  }catch(e){}
  const w = $('cw'), c = $('cv');
  // Solo escalar la mesa si el juego está visible
  const gameEl = $('game');
  const gameVisible = gameEl && (gameEl.style.display === 'block' || getComputedStyle(gameEl).display !== 'none');
  if(!w || !c || !gameVisible) return;

  const r = w.getBoundingClientRect();
  const cs = getComputedStyle(w);
  const padT = parseFloat(cs.paddingTop) || 0;
  const padB = parseFloat(cs.paddingBottom) || 0;
  // Reservar espacio mínimo para las barras laterales (fuerza izquierda + puntería derecha)
  const sideReserve = 58; // px por lado (fuerza izq + aim + Tirar der)
  const availW = Math.max(120, r.width - sideReserve * 2);
  const availH = Math.max(80, r.height - padT - padB);

  // Escala máxima manteniendo relación 2:1 (800x400 lógico)
  const k = Math.min(availW / 800, availH / 400);
  if(k > 0){
    c.style.width  = Math.floor(800 * k) + 'px';
    c.style.height = Math.floor(400 * k) + 'px';
  }
  placeSide();
  try{ updPwBar(); }catch(e){}
}
/* barra de puntería pegada al borde derecho de la mesa y barra de fuerza vertical al borde izquierdo */
function placeSide(){
  const w = $('cw'), c = $('cv'), ab = $('aimb'), pb = $('pwb'), gb = $('gb');
  if(!w || !c) return;
  const wr = w.getBoundingClientRect(), cr = c.getBoundingClientRect();
  if(!cr.width) return;
  const midY = cr.top - wr.top + cr.height / 2;
  // Altura de las barras proporcional a la mesa
  const hAim = Math.max(120, Math.min(280, cr.height * .82));
  const hPwr = Math.max(120, Math.min(240, cr.height * .70));
  if(ab){
    ab.style.right = 'auto';
    ab.style.height = hAim + 'px';
    ab.style.top = midY + 'px';
    // Barra de puntería un poco más adentro si hay botón Tirar
    ab.style.left = Math.min(cr.right - wr.left + 4, wr.width - 42) + 'px';
  }
  if(pb){
    pb.style.height = hPwr + 'px';
    pb.style.top = midY + 'px';
    pb.style.left = Math.max(2, cr.left - wr.left - 34) + 'px';
  }
  // Botón Tirar al costado derecho de la mesa
  if(gb){
    gb.style.top = midY + 'px';
    gb.style.right = 'auto';
    gb.style.left = Math.min(cr.right - wr.left + 42, wr.width - 52) + 'px';
    gb.style.transform = 'translateY(-50%)';
  }
}

}

function netSend(over){
  if(!G || !G.ref) return;
  const n = G.ps ? G.seq : ++G.seq;
  G.ps = false;
  G.applied = n;
  const o = { b:G.balls.map(q => [q.n, q.x, q.y, q.a]), turn:G.turn, gr:G.groups.map(x => x || ''), bih:!!G.bih, brk:!!G.brk, over:over == null ? null : over, pk:G.pocketed };

function netIn(d){
  if(!G || !G.online || !d) return;
  if(d.ab != null && d.ab != G.me && !G.over) return netEnd(G.me, 'Tu rival abandonó');
  const s = d.shot;
  if(s && s.n > G.seen && s.by != G.me){
    G.seen = s.n;
    G.seq = Math.max(G.seq, s.n);
    const c = G.balls[0];
    c.x = s.cx; c.y = s.cy;
    G.mine = false;
    G.bih = false;
    G.drag = null;
    G.sp = [s.sx || 0, s.sy || 0];
    G.hh = s.h;
    shoot(s.a, s.pw);
    G.hh = null;
  }
  if(d.st && d.st.n > G.applied && d.st.by != G.me){
    G.pend = d.st;
    if(!G.moving) netApply();
  }
  const m0 = d.msg;
  const m = (m0 && m0.by != G.me && esBloqueado(G.rivalUid)) ? null : (m0 ? Object.assign({}, m0, { m:filtrar(String(m0.m || '').slice(0, 60)) }) : m0);
  if(m && m.by != G.me && m.id != G.lm){
    G.lm = m.id;
    const t = (G.pn[m.by] || 'Rival') + ': ' + esc(m.m);
    G.chat = (G.chat || []).concat(t);
    hud();
    if(m.m){
      const soloEmote = /^\p{Emoji}+$/u.test(m.m);
      if(soloEmote) lanzarEmote(m.m, G.pn[m.by] || 'Rival');
      const bajo = (m.m || '').toLowerCase();
      if(/gg|buena|bien|buen tiro/.test(bajo)) lanzarEmote('👏', G.pn[m.by] || 'Rival');
      if(/jaja|lol|xd/.test(bajo)) lanzarEmote('😂', G.pn[m.by] || 'Rival');
    }
  }
  if(d.votacion && typeof mostrarVotacionJugador === 'function') mostrarVotacionJugador(d.votacion);
}
function netApply(){
  const s = G.pend;
  if(!s) return;
  G.pend = null;
  G.wait = 0;
  G.applied = s.n;
  G.seq = Math.max(G.seq, s.n);
  const o = JSON.parse(s.j);
  G.balls = o.b.map(([n, x, y, a]) => ({ n, x, y, vx:0, vy:0, a }));
  G.turn = o.turn;
  G.groups = o.gr.map(x => x || null);

}

  if(tipo === 'cash' && S.cash < cant) return notif('No te alcanza la plata', 'red');

    prevS.total = (prevS.total || 0) + equiv;
    prevS.gifts = (prevS.gifts || 0) + 1;

function tiempoHastaProximoLunes(){
  const d = new Date();
  const dia = d.getDay() || 7;
  const diasFaltantes = 8 - dia;
  const prox = new Date(d); prox.setDate(d.getDate() + diasFaltantes); prox.setHours(0, 0, 0, 0);
  const ms = prox - new Date();
  const dias = Math.floor(ms / 86400000);
  const horas = Math.floor((ms % 86400000) / 3600000);
  const min = Math.floor((ms % 3600000) / 60000);
  return `${dias}d ${horas}h ${min}min`;
}

  chico:{ min:1, max:299, emoji:'🪙', extra:['✨','💰','👍'], color:'#ffd23f' },
  medio:{ min:300, max:999, emoji:'💰', extra:['🔥','💎','🎉'], color:'#ff8c00' },

  mega:{ min:5000, max:Infinity, emoji:'👑', extra:['🌈','⚡','🎆'], color:'#ff00ff' }
};
function reaccionPorMonto(equiv){
  for(const k of ['mega','grande','medio','chico']){

function filtrar(t){
  t = String(t == null ? '' : t);
  const MALAS = ['puta','puto','mierda','cag','concha','verga','pija','chupa','pendej','boludo','carajo','hdp','forro','nazi','violar','suicid','maricon','sorete','tarado'];
  const MAP = {'á':'a','à':'a','ä':'a','é':'e','è':'e','ë':'e','í':'i','ì':'i','ï':'i','ó':'o','ò':'o','ö':'o','ú':'u','ù':'u','ü':'u','4':'a','3':'e','1':'i','0':'o','@':'a','$':'s','ñ':'n'};
  let norm = ''; for(const ch of t.toLowerCase()) norm += (MAP[ch] || ch);
  const marcas = new Array(t.length).fill(false);
  MALAS.forEach(w => { let i = norm.indexOf(w); while(i >= 0){ for(let k = i; k < i + w.length; k++) marcas[k] = true; i = norm.indexOf(w, i + 1); } });
  let out = ''; for(let i = 0; i < t.length; i++) out += marcas[i] ? '*' : t[i];
  return out.replace(/(https?:\/\/|www\.)\S+/gi, '***');
}

let ELO_CACHE = null;
function calcularELO(eloA, eloB, resA){
  const K = 32;
  const EA = 1 / (1 + Math.pow(10, (eloB - eloA) / 400));
  const nuevo = Math.round(eloA + K * (resA - EA));
  return { elo:nuevo, cambio:nuevo - eloA };
}
async function cargarELO(){
  try{
    const db = await dbq();
    if(!db) return null;
    const me = await uid();
    const sn = await db.doc('elo/' + me).get();
    if(sn.exists){
      ELO_CACHE = sn.data();
      S.elo = ELO_CACHE.elo || 1000;
      save();
      return ELO_CACHE;
    }
    ELO_CACHE = { elo:1000, partidas:0, wins:0, losses:0, mejor:1000, historial:[], u:S.uid, n:S.name, c:S.cc || '' };
    await db.doc('elo/' + me).set(ELO_CACHE);
    S.elo = 1000; save();
    return ELO_CACHE;
  }catch(e){ return null; }
}

  const db = await dbq(), me = await uid();

  try{

async function clanJoin(){

  try{
    const r = db.doc('clanes/' + c), sn = await r.get();

    const m = (d.m || []).concat([{ u:me, n:S.name, p:0 }]);

async function clanLeave(){

let VITRINA = { activa:false, indice:0, tacos:[], angulo:0, autoRotar:true, autoTimer:null, radio:450, modo:'owned', zoom:1 };
function abrirVitrina(){
  VITRINA.tacos = [];
  const owned = S.owned || [];
  VITRINA.tacos.push(S.cue);
  for(let i = 0; i < CUES.length; i++){
    if(i === S.cue) continue;
    if(owned.includes(i) || (CUES[i] && CUES[i].exclusivo)) VITRINA.tacos.push(i);
  }
  if(VITRINA.modo === 'owned') VITRINA.tacos = VITRINA.tacos.filter(i => owned.includes(i) || (CUES[i] && CUES[i].exclusivo));
  VITRINA.indice = 0;
  VITRINA.angulo = 0;
  VITRINA.zoom = 1;
  VITRINA.activa = true;
  $('vitrinaOverlay').classList.add('on');
  setTimeout(() => {
    const carrusel = $('vitrinaCarrusel');
    if(carrusel) carrusel.style.transform = `translate(-50%,-50%) rotateY(0deg) scale(1)`;
    renderVitrina();
  }, 50);
  iniciarAutoRotarVitrina();
  document.body.style.overflow = 'hidden';
  ac();
  snd('win', .4);
  vitrinaMusica();
}
function cerrarVitrina(){
  VITRINA.activa = false;
  $('vitrinaOverlay').classList.remove('on');
  clearInterval(VITRINA.autoTimer);
  document.body.style.overflow = '';
  if(VITRINA_MUSIC){ clearInterval(VITRINA_MUSIC); VITRINA_MUSIC = null; }
}
let VITRINA_MUSIC = null;
function vitrinaMusica(){
  const a = ac();
  if(!a || MUTE) return;
  if(VITRINA_MUSIC) clearInterval(VITRINA_MUSIC);
  const notas = [262, 330, 392, 523, 659, 784];
  let i = 0;
  VITRINA_MUSIC = setInterval(() => {
    if(!VITRINA.activa){ clearInterval(VITRINA_MUSIC); VITRINA_MUSIC = null; return; }
    if(MUTE) return;
    const n = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.value = notas[i % notas.length];
    g.gain.setValueAtTime(.04 * VOL, n);
    g.gain.exponentialRampToValueAtTime(.001, n + .8);
    o.connect(g); g.connect(a.destination);
    o.start(n); o.stop(n + .8);
    i++;
  }, 700);
}
function renderVitrina(){
  const cont = $('vitrinaCarrusel');
  if(!cont) return;
  cont.innerHTML = '';
  const n = VITRINA.tacos.length;
  const paso = 360 / Math.max(1, n);
  const radio = n <= 3 ? 250 : n <= 6 ? 350 : 450;
  VITRINA.radio = radio;
  VITRINA.tacos.forEach((idx, pos) => {
    const item = document.createElement('div');
    item.className = 'vitrina-item';
    const esActivo = pos === VITRINA.indice;
    if(esActivo) item.classList.add('activo');
    const angulo = paso * pos;
    const rad = angulo * Math.PI / 180;
    const x = Math.sin(rad) * radio;
    const z = Math.cos(rad) * radio;
    const escala = 0.5 + ((z + radio) / (2 * radio)) * 0.7;
    item.style.transform = `translateX(${x}px) translateZ(${z}px) scale(${escala})`;
    item.innerHTML = `<div style="position:relative;width:100%;height:100%">${tacoPreviewConEfectos(idx)}</div>`;
    cont.appendChild(item);
  });
  const idx = VITRINA.tacos[VITRINA.indice];
  const c = CUES[idx];
  const nivel = getNivelTaco(idx);
  const lvl = NIVELES_TACO.find(x => x.n === nivel);
  const stats = getStatsTaco(idx);
  const partidas = S.tacoStats[idx]?.partidas || 0;
  const winrate = partidas ? Math.round((S.tacoStats[idx].wins / partidas) * 100) : 0;
  const info = document.createElement('div');
  info.innerHTML = `
    <h3>${esc(c?.n || 'Taco')}${S.cue === idx ? ' <span style="color:#4cd137;font-size:14px">(en uso)</span>' : ''}</h3>
    ${nivel > 1 ? `<p style="color:#ffd700;font-weight:900">${lvl.icon} Nivel ${nivel} · ${lvl.nombre}</p>` : '<p style="color:#8a90a8">Nivel 1 · Novato</p>'}
    <div class=stats>
      <div>⚡ Fuerza ×${stats.pw.toFixed(2)}</div>
      <div>🎯 Puntería ${Math.round(stats.aim)}</div>
      ${partidas ? `<div>🏆 ${winrate}% winrate (${partidas} partidas)</div>` : '<div style="color:#8a90a8">Sin partidas aún</div>'}
      ${xpSiguienteNivel(idx) ? `<div style="color:#8a90a8;font-size:11px">XP: ${xpSiguienteNivel(idx).actual}/${xpSiguienteNivel(idx).necesario}</div>` : '<div style="color:#ffd700">🌟 Nivel máximo</div>'}
    </div>`;
  $('vitrinaInfo').innerHTML = '';
  $('vitrinaInfo').appendChild(info);
  $('vitrinaNivel').innerHTML = `<span class="taco-nivel${nivel === 5 ? ' max' : ''}" style="position:static">${lvl.icon} Nivel ${nivel}</span>`;
  $('vitrinaBotones').innerHTML = `
    <button style="background:linear-gradient(#2fa633,#1a5a20);color:#fff" onclick="${S.cue === idx ? '' : 'eq(' + idx + ');abrirVitrina()'}">${S.cue === idx ? '✅ En uso' : '🎱 Usar este taco'}</button>
    <button style="background:linear-gradient(#833ab4,#405de6);color:#fff" onclick="verEvolucionTaco(${idx})">👁️ Ver evolución</button>
    <button style="background:linear-gradient(#ffd700,#ff8c00);color:#000" onclick="compartirVitrina()">📸 Compartir</button>
    <button style="background:#3a4166;color:#fff" onclick="VITRINA.modo=VITRINA.modo==='owned'?'all':'owned';abrirVitrina()">${VITRINA.modo === 'owned' ? 'Ver todos' : 'Solo míos'}</button>
    <button style="background:#3a4166;color:#fff" onclick="vitrinaZoom(1)">➕</button>
    <button style="background:#3a4166;color:#fff" onclick="vitrinaZoom(-1)">➖</button>
    <button style="background:#555b70;color:#fff" onclick="cerrarVitrina()">✕ Cerrar</button>`;
  const big = $('vitrinaPreviewBig');
  if(big) big.innerHTML = `<div class="${`taco-preview nv${nivel}${c?.exclusivo ? ' exclusivo' : ''}`}" style="transform:scale(1.5)">${tacoSVG(idx)}${nivel === 5 ? '<div class="taco-crown">👑</div>' : ''}</div>`;
}
function vitrinaAnterior(){ VITRINA.indice = (VITRINA.indice - 1 + VITRINA.tacos.length) % VITRINA.tacos.length; actualizarRotacionVitrina(); }
function vitrinaSiguiente(){ VITRINA.indice = (VITRINA.indice + 1) % VITRINA.tacos.length; actualizarRotacionVitrina(); }
function actualizarRotacionVitrina(){
  const n = VITRINA.tacos.length;
  const paso = 360 / n;
  const anguloObjetivo = -paso * VITRINA.indice;
  VITRINA.angulo = anguloObjetivo;
  const carrusel = $('vitrinaCarrusel');
  if(carrusel) carrusel.style.transform = `translate(-50%,-50%) rotateY(${VITRINA.angulo}deg) scale(${VITRINA.zoom})`;
  const items = carrusel.querySelectorAll('.vitrina-item');
  items.forEach((item, i) => { item.classList.toggle('activo', i === VITRINA.indice); });
  setTimeout(() => renderVitrina(), 100);
}
function iniciarAutoRotarVitrina(){
  clearInterval(VITRINA.autoTimer);
  if(!VITRINA.autoRotar) return;
  VITRINA.autoTimer = setInterval(() => {
    if(!VITRINA.activa) return;
    if(document.hidden) return;
    vitrinaSiguiente();
  }, 4500);
}
function vitrinaZoom(d){
  VITRINA.zoom = Math.max(0.5, Math.min(1.8, VITRINA.zoom + d * 0.15));
  const carrusel = $('vitrinaCarrusel');
  if(carrusel) carrusel.style.transform = `translate(-50%,-50%) rotateY(${VITRINA.angulo}deg) scale(${VITRINA.zoom})`;
}
document.addEventListener('keydown', e => {
  if(!VITRINA.activa) return;
  if(e.key === 'ArrowLeft') vitrinaAnterior();
  else if(e.key === 'ArrowRight') vitrinaSiguiente();
  else if(e.key === 'Escape') cerrarVitrina();
});
(function(){
  const el = $('vitrinaOverlay');
  if(!el) return;
  let startX = null;
  el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive:true });
  el.addEventListener('touchend', e => {
    if(startX === null) return;
    const diff = e.changedTouches[0].clientX - startX;
    if(Math.abs(diff) > 50){ if(diff > 0) vitrinaAnterior(); else vitrinaSiguiente(); }
    startX = null;
  }, { passive:true });
})();

function mostrarEventoActual(forzar){
  const ev = eventoActual();
  const horaKey = ev.id + '_' + new Date().toDateString() + '_' + new Date().getHours();
  if(!forzar && S.eventoVisto === horaKey) return;
  S.eventoVisto = horaKey; save();
  let e = $('eventoHora');
  if(!e){ e = document.createElement('div'); e.id = 'eventoHora'; e.className = 'evento-hora'; document.body.appendChild(e); }
  e.innerHTML = `<div class="icon">${ev.icon}</div><h3>${ev.n}</h3><div class="desc">${ev.desc}</div><div class="bonus">${ev.bonusTexto}</div><button class=b1 style="width:100%;padding:12px;margin-top:12px" onclick="cerrarEventoHora()">¡Vamos!</button>`;
  e.classList.add('on');
  snd('win', .5);
  setTimeout(() => cerrarEventoHora(), 8000);
}
function cerrarEventoHora(){ const e = $('eventoHora'); if(e) e.classList.remove('on'); }
function aplicarBonusHora(tipo, cantidad){
  const ev = eventoActual();
  if(tipo === 'coins' && ev.multCoins) return Math.round(cantidad * ev.multCoins);
  if(tipo === 'xp' && ev.multXP) return Math.round(cantidad * ev.multXP);
  if(tipo === 'trofeos' && ev.multTrofeos) return Math.round(cantidad * ev.multTrofeos);
  if(tipo === 'premio' && ev.multPremios) return Math.round(cantidad * ev.multPremios);
  return cantidad;
}
function eventosHoraM(){

const MENTOR_TIPS = [
  { id:'first-shot', cond:(g) => g.shots === 0 && g.turn === 0, tip:'Arrastrá el dedo sobre la mesa para apuntar.' },
  { id:'call-pocket', cond:(g) => necesitaCantar(g), tip:'Con la 8 sola, tocá la tronera donde la vas a meter.' },
  { id:'power-80', cond:(g) => g.shots >= 3 && g.shots <= 5 && g.turn === 0, tip:'Usá 60-70% de fuerza para mayor control.' },
  { id:'bih-move', cond:(g) => g.bih && g.turn === 0, tip:'Tenés bola en mano: arrastrá la blanca.' }
];
let MENTOR = { activo:true, lastTip:0 };
function necesitaCantar(g){
  if(!g || !g.groups) return false;
  if(g.cfg.mode == 'nine') return false;
  const t = g.turn;
  if(!g.groups[t]) return false;
  const rest = g.balls.filter(b => b.a && b.n > 0 && b.n != 8 && (g.groups[t] == 's' ? b.n < 8 : b.n > 8));
  return rest.length === 0 && g.balls.some(b => b.a && b.n === 8) && g.call == null;
}
function checkMentor(){
  if(!MENTOR.activo || !G || G.over || G.turn !== 0 || G.moving) return;
  if(Date.now() - MENTOR.lastTip < 12000) return;
  const nivel = LV()[0];
  if(nivel >= 5 && (S.played || 0) >= 20) return;
  const yaMostrados = S.mentorVistos || [];
  for(const t of MENTOR_TIPS){
    if(yaMostrados.includes(t.id)) continue;
    try{ if(t.cond(G)){ mostrarTip(t.tip); S.mentorVistos = [...yaMostrados, t.id]; save(); MENTOR.lastTip = Date.now(); break; } }catch(e){}
  }
}

  e.textContent = txt;
  e.classList.add('on');

}

let TRAIL = { puntos:[], duracion:600, color:'#ffd700', activo:false, intensidad:1 };
function iniciarTrail(){
  if(S.trailOn === false){ TRAIL.activo = false; return; }
  const nivel = getNivelTaco(S.cue);
  if(nivel < 3){ TRAIL.activo = false; return; }
  TRAIL.activo = true;
  TRAIL.intensidad = nivel === 5 ? 2 : nivel === 4 ? 1.5 : 1;
  TRAIL.color = nivel === 5 ? '#ff00ff' : nivel === 4 ? '#ff8c00' : '#ffd700';
  TRAIL.duracion = nivel === 5 ? 900 : nivel === 4 ? 700 : 500;
}
function agregarPuntoTrail(x, y){
  if(!TRAIL.activo) return;
  const ahora = Date.now();
  const ultimo = TRAIL.puntos[TRAIL.puntos.length - 1];
  if(ultimo && Math.hypot(x - ultimo.x, y - ultimo.y) < 6) return;
  TRAIL.puntos.push({ x, y, t:ahora });
  if(TRAIL.puntos.length > 40) TRAIL.puntos.shift();
}
function limpiarTrail(){
  const ahora = Date.now();
  TRAIL.puntos = TRAIL.puntos.filter(p => ahora - p.t < TRAIL.duracion);
}
function dibujarTrail(){
  if(!TRAIL.activo || TRAIL.puntos.length < 2) return;
  const ahora = Date.now();
  limpiarTrail();
  ctx.save();
  ctx.lineCap = 'round';
  for(let i = 0; i < TRAIL.puntos.length - 1; i++){
    const a = TRAIL.puntos[i], b = TRAIL.puntos[i + 1];
    const edad = ahora - a.t;
    const alpha = Math.max(0, 1 - edad / TRAIL.duracion);
    if(alpha <= 0) continue;
    const prog = i / TRAIL.puntos.length;
    const grosor = (2 + prog * 3) * TRAIL.intensidad;
    ctx.globalAlpha = alpha * 0.6;
    ctx.strokeStyle = TRAIL.color;
    ctx.shadowColor = TRAIL.color;
    ctx.shadowBlur = (8 + prog * 8) * TRAIL.intensidad;
    ctx.lineWidth = grosor;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#fff';
    ctx.shadowBlur = (4 + prog * 6) * TRAIL.intensidad;
    ctx.lineWidth = grosor * 0.4;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}
function resetTrail(){ TRAIL.puntos = []; }

  if(!G || !G.online) return notif('Solo en partidas online', 'red');
  if(VOZ.activo) return;
  try{
    VOZ.stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
    VOZ.activo = true;
    notif('🎤 Voz iniciada', 'green');
    $('voicePanel').classList.add('on');
    $('voiceStatus').textContent = '🟢 Conectado (demo)';
  }catch(e){ notif('No se pudo acceder al micrófono', 'red'); }
}
function cerrarVoz(){
  if(VOZ.stream){ VOZ.stream.getTracks().forEach(t => t.stop()); VOZ.stream = null; }
  VOZ.activo = false;
  $('voicePanel').classList.remove('on');
  notif('Voz cerrada', '');
}

function probarSonidoNivel(n){
  const xpBackup = S.tacoStats[S.cue]?.xp || 0;
  if(!S.tacoStats[S.cue]) S.tacoStats[S.cue] = {};
  S.tacoStats[S.cue].xp = NIVELES_TACO.find(x => x.n === n).xp;
  const nivel = getNivelTaco(S.cue);
  const cfg = SONIDOS_TACO[nivel];
  const a = ac();
  if(a && !MUTE){
    const now = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(cfg.hit[0], now);
    o.frequency.exponentialRampToValueAtTime(cfg.hit[1], now + .1);
    g.gain.setValueAtTime(VOL * .5, now);
    g.gain.exponentialRampToValueAtTime(.001, now + .15);
    o.connect(g); g.connect(a.destination);
    o.start(now); o.stop(now + .2);
  }
  setTimeout(() => { S.tacoStats[S.cue].xp = xpBackup; }, 1000);
}

  });

  for(let i = 0; i < 4; i++) BR.mesas.push(BR.jugadores.slice(i * 4, i * 4 + 4));

function renderBR(){
  M(`<h2>⚔️ BATTLE ROYALE</h2><div class=br-bracket>${BR.mesas.map((mesa, mi) => `<div style="background:#0007;border-radius:10px;padding:6px">${mesa.map(j => `<div class="br-slot ${j.vivo ? 'vivo' : 'eliminado'} ${j.yo ? 'yo' : ''}"><div class=av-small>${j.av}</div><div class=nm-small>${esc(j.n)}</div></div>`).join('')}</div>`).join('')}</div><button class=b6 style="width:100%;padding:14px;margin-top:8px" onclick="brJugarRonda()">⚔️ Jugar ronda</button>`);
}
function brJugarRonda(){
  X();
  const miMesa = BR.mesas.find(m => m.some(j => j.yo));
  const miMesaIdx = BR.mesas.indexOf(miMesa);
  BR.mesas.forEach((mesa, mi) => {
    if(mi === miMesaIdx) return;
    const vivos = mesa.filter(j => j.vivo);
    const orden = vivos.slice().sort(() => Math.random() - .5);
    orden.forEach((j, i) => { if(i < 1) return; j.vivo = false; });
  });
  const rivales = miMesa.filter(j => j.vivo && !j.yo);
  if(!rivales.length){ setTimeout(() => brSiguienteRonda(), 800); return; }
  const rival = rivales[Math.floor(Math.random() * rivales.length)];
  startGame({ mode:'vs', v:Math.min(20, BR.ronda * 5 + 5), battleRoyale:true, rival });
  LC = null;
  if(G) G.brData = { rival };
}
function brVictoria(){
  if(!G || !G.brData) return;
  const { rival } = G.brData;
  const r = BR.jugadores.find(j => j.n === rival.n);
  if(r) r.vivo = false;
  const yo = BR.jugadores.find(j => j.yo);
  if(yo) yo.kills++;
  notif('⚔️ ¡Eliminaste a ' + rival.n + '!', 'green');
  setTimeout(() => brSiguienteRonda(), 1200);
}
function brDerrota(){
  const yo = BR.jugadores.find(j => j.yo);
  if(yo) yo.vivo = false;
  notif('💀 Fuiste eliminado', 'red');
  setTimeout(() => brSiguienteRonda(), 1500);
}
function brSiguienteRonda(){
  if(!BR.activo) return;
  const vivos = BR.jugadores.filter(j => j.vivo);
  if(vivos.length <= 1){
    const ganador = vivos[0];
    if(ganador && ganador.yo){
      S.coins += 5000; S.cash += 5;
      S.brWins = (S.brWins || 0) + 1;
      save();
      pop(`<h2>🏆 ¡GANADOR!</h2><p style="text-align:center;font-size:60px">👑</p><p style="text-align:center;color:#ffd700">+5000 🪙 +5 💎</p>`);
      celebrate(S.name);
    } else notif('💀 Eliminado', 'red');
    BR.activo = false;
    return;
  }
  BR.ronda++;
  BR.mesas = [];
  for(let i = 0; i < vivos.length; i += 4) BR.mesas.push(vivos.slice(i, i + 4));
}

const _stepAux = step;
step = function(){
  if(G){
    const f = 1 + (climaFric() - 1) * 0.15;   /* el clima solo ajusta un poco el roce (antes aceleraba las bolas en 4 distritos) */
    for(const b of G.balls) if(b.a){ b.vx *= f; b.vy *= f; }
  }
  _stepAux();
};
function climaFric(){ if(!G || G.cfg.mode != 'vs') return 1; return clima(G.cfg.v).f; }

function renderClima(dist){
  let e = $('clima');
  if(e) e.remove();
  const c = clima(dist);
  if(!c.t) return;
  e = document.createElement('div');
  e.id = 'clima';
  e.className = 'weather';
  if(c.t === 'rain'){
    for(let i = 0; i < 40; i++){
      const d = document.createElement('div');
      d.className = 'rain';
      d.style.left = (Math.random() * 100) + '%';
      d.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
      d.style.animationDelay = (Math.random() * 2) + 's';
      e.appendChild(d);
    }
  } else if(c.t === 'snow'){
    for(let i = 0; i < 30; i++){
      const d = document.createElement('div');
      d.className = 'snow';
      d.style.left = (Math.random() * 100) + '%';
      d.style.animationDuration = (3 + Math.random() * 3) + 's';
      d.style.animationDelay = (Math.random() * 3) + 's';
      e.appendChild(d);
    }
  } else if(c.t === 'yerba'){
    for(let i = 0; i < 24; i++){
      const d = document.createElement('div');
      d.className = 'leaf';
      d.textContent = i % 4 == 3 ? '🍃' : '🌿';
      d.style.left = (Math.random() * 100) + '%';
      d.style.animationDuration = (4 + Math.random() * 4) + 's';
      d.style.animationDelay = (Math.random() * 5) + 's';
      e.appendChild(d);
    }
  } else if(c.t === 'heat'){
    const d = document.createElement('div');
    d.className = 'heat';
    e.appendChild(d);
  } else if(c.t === 'wind'){
    for(let i = 0; i < 6; i++){
      const d = document.createElement('div');
      d.className = 'wind';
      d.textContent = '💨';
      d.style.top = (20 + Math.random() * 60) + '%';
      d.style.animationDuration = (4 + Math.random() * 3) + 's';
      d.style.animationDelay = (Math.random() * 4) + 's';
      e.appendChild(d);
    }
  }
  $('cw').appendChild(e);
  if(c.msg) notif(c.msg, '');
}

const _endAux = end;
end = function(w){
  const boost = S.boost;
  const eraRey = G && G.cfg && G.cfg.rey;
  const cl = S.clan;
  const brData = G && G.brData;
  const expressData = G && G.expressData;
  const suizoData = G && G.suizoData;
  const ev = G && G.cfg && G.cfg.evTemp;
  _endAux(w);
  if(w == 0 && boost){ S.coins += 500; S.boost = 0; save(); notif('🔥 Boost aplicado: +500 🪙', 'green'); }
  if(brData){ setTimeout(() => { w === 0 ? brVictoria() : brDerrota(); }, 400); }
  if(expressData){
    if(G && G.expressTimer) clearInterval(G.expressTimer);
    setTimeout(() => { w === 0 ? expressVictoria() : expressDerrota(); }, 400);
  }
  if(suizoData) setTimeout(() => suizoRegistrarResultado(suizoData.id, suizoData.ronda, S.uid, w === 0), 500);
  if(cl && w == 0) clanAddPoints(1);
  if(ev && w === 0){
    const extra = Math.floor(100 * (ev.mult - 1));
    S.coins += extra; save();
    setTimeout(() => notif(`🎭 Evento: +${extra} 🪙`, 'green'), 800);
  }
  if(eraRey && S.rey){
    if(w === 0){
      S.rey.ola++; S.rey.defensas++;
      S.coins += 400;
      if(S.rey.defensas % 5 === 0) S.cash += 1;
      save();
      setTimeout(() => {
        pop(`<h2>👑 ¡Oleada superada!</h2><p style="text-align:center">+400 🪙 · Vidas: ${S.rey.vidas}</p><button class=b1 style="width:100%;padding:12px;margin-top:10px" onclick="X();reyJugar()">▶ Siguiente</button>`);
      }, 800);
    } else {
      S.rey.vidas--; save();
      if(S.rey.vidas <= 0){
        setTimeout(() => {
          pop(`<h2>👑 ¡Fin!</h2><p style="text-align:center">Oleadas: ${S.rey.defensas}</p>`);
          S.rey = null; save();
          celebrate(S.name);
        }, 800);
      } else {
        setTimeout(() => {
          pop(`<h2>💔 Perdiste una vida</h2><p style="text-align:center">Quedan ${S.rey.vidas}</p><button class=b1 style="width:100%;padding:12px;margin-top:10px" onclick="X();reyJugar()">▶ Continuar</button>`);
        }, 800);
      }
    }
  }
};

/* ============================================================
   DESAFÍO DIARIO + RACHA + PARTIDA RÁPIDA + ENTRENAMIENTO
   ============================================================ */
const DAILY_POOL = [
  {id:'win1', t:'Ganá 1 partida', check:s=> (s.dailyWins||0)>=1, reward:200},
  {id:'win3', t:'Ganá 3 partidas', check:s=> (s.dailyWins||0)>=3, reward:500},
  {id:'pocket10', t:'Embocá 10 bolas', check:s=> (s.dailyPockets||0)>=10, reward:300},
  {id:'streak2', t:'Ganá 2 seguidas', check:s=> (s.streak||0)>=2, reward:400},
  {id:'nine', t:'Ganá una 9-ball', check:s=> !!(s.dailyNine), reward:350},
  {id:'nofail', t:'Ganá sin fallar un tiro', check:s=> !!(s.dailyPerfect), reward:600},
];
function dailyKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dailyGet(){
  const k = dailyKey();
  if(S.dailyDay !== k){
    S.dailyDay = k;
    S.dailyWins = 0; S.dailyPockets = 0; S.dailyNine = 0; S.dailyPerfect = 0; S.dailyClaimed = 0;
    // Elegir 2 desafíos del día según el día
    const seed = k.split('-').reduce((a,b)=>a+parseInt(b),0);
    S.dailyIds = [DAILY_POOL[seed % DAILY_POOL.length].id, DAILY_POOL[(seed+3) % DAILY_POOL.length].id];
    save();
  }
  return S.dailyIds.map(id => DAILY_POOL.find(d=>d.id===id)).filter(Boolean);
}
function dailyOnWin(cfg){
  S.dailyWins = (S.dailyWins||0)+1;
  if(cfg && cfg.mode==='nine') S.dailyNine = 1;
  if(cfg && cfg.perfect) S.dailyPerfect = 1;
  // racha diaria de login
  const k = dailyKey();
  if(S.lastLogin !== k){
    const yest = new Date(); yest.setDate(yest.getDate()-1);
    const yk = yest.getFullYear()+'-'+(yest.getMonth()+1)+'-'+yest.getDate();
    S.loginStreak = (S.lastLogin === yk) ? (S.loginStreak||0)+1 : 1;
    S.lastLogin = k;
  }
  save();
  checkDailyComplete();
}
function checkDailyComplete(){
  const list = dailyGet();
  let all = true;
  list.forEach(d => { if(!d.check(S)) all=false; });
  if(all && !S.dailyClaimed){
    const bonus = list.reduce((a,d)=>a+d.reward,0) + Math.min(300, (S.loginStreak||1)*50);
    S.coins += bonus;
    S.dailyClaimed = 1;
    save();
    setTimeout(()=> floatTxt('🎉 Diario +'+bonus+' 🪙', '#4cd137'), 600);
  }
}
function dailyM(){
  const list = dailyGet();

  let html = `<h2>📅 Desafío diario</h2>

}

function floatTxt(txt, color){
  const el = document.createElement('div');
  el.textContent = txt;
  el.style.cssText = 'position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font:900 28px system-ui;color:'+(color||'#ffd23f')+';text-shadow:0 2px 8px #000,0 0 20px '+(color||'#ffd23f')+'88;z-index:80;pointer-events:none;opacity:0;transition:all .7s ease-out';
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.top='32%'; });
  setTimeout(()=>{ el.style.opacity='0'; el.style.top='22%'; setTimeout(()=>el.remove(),700); },900);
}

<script>
/* Funciones online: visibles solo con backend (Firebase configurado). Inicio de sesión/nube manual siempre oculto fuera de Claude. */
(function(){
  var back = !!window.claude || !!(window.firebase && window.B8_FIREBASE_CONFIG && window.B8_FIREBASE_CONFIG.apiKey);
  var ON = ['abrirSuizoPanel', 'abrirTorneoPanel', 'clanM', 'clanCreate', 'clanJoin', 'clanRank', 'eloRanking', 'frPub', 'maestrosTacosGlobal', 'mpMenu', 'mpCreate', 'mpJoin', 'mpQuick', 'rankM', 'specM', 'specRanking', 'specRankSemanal', 'specHistory', 'specWatch', 'crearTorneoEspectable', 'crearTorneoSuizo', 'verReplayEspectable', 'statsEspectador', 'logrosEspectador', 'suscribirseA', 'cargarSuscripciones'];
  var SIEMPRE = ['loginAcc','cloud'];
  var NUCLEO = ['mpMenu','mpCreate','mpJoin','mpQuick','eloRanking','rankM'];
  var EXTRAS = ON.filter(function(n){ return NUCLEO.indexOf(n) < 0; });
  var soloPartidas = !window.claude && window.B8_ONLY_MATCHES !== false; /* 1ª versión online: solo partidas 1 vs 1 + ranking ELO */
  var lista = !back ? ON.concat(SIEMPRE) : (window.claude ? [] : SIEMPRE.concat(soloPartidas ? EXTRAS : []));
  if(!lista.length) return;
  var RX = new RegExp('\\b(' + lista.join('|') + ')\\s*\\(');
  function sweep(){ try{ document.querySelectorAll('[onclick]').forEach(function(e){ if(RX.test(e.getAttribute('onclick')||'')) e.style.display='none'; }); }catch(e){} }
  try{ new MutationObserver(sweep).observe(document.body,{childList:true,subtree:true}); }catch(e){}
  sweep();
})();
</script>
